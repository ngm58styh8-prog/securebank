name: Build Admin Panel

on:
  push:
    branches: [main]
    paths-ignore:
      - "admin-v2/**"
      - "**.md"

permissions:
  contents: write

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-panel/package.json

      - name: Install and build admin panel
        run: |
          cd admin-panel
          npm install
          npm run build

      - name: Commit admin-v2 build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v2/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Build admin-v2 for Vercel [skip ci]"
          git push
