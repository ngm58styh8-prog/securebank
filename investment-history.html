<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GlobalVest — Investment History</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/dashboard-premium.css?v=bell-fix">
<link rel="stylesheet" href="css/luxury.css?v=mk1">
<link rel="stylesheet" href="css/globalvest-bottom-nav.css?v=2">
<link rel="stylesheet" href="css/investments.css?v=1">
<link rel="stylesheet" href="css/notifications.css?v=notif-premium2">
</head>
<body class="dashboard-premium luxury-app investments-page" data-theme="dark">
<header class="gv-header" style="padding:16px;">
    <h1>Investment History</h1>
    <a href="/investments" class="gv-nav-link">← Investments</a>
</header>
<main class="container" style="padding:16px;">
    <div class="toolbar-row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <select id="invHistFilter">
            <option value="all">All Investments</option>
            <option value="gold">Gold</option>
            <option value="crypto">Crypto</option>
            <option value="stocks">Stocks</option>
            <option value="commodities">Commodities</option>
        </select>
        <button type="button" class="deposit-btn" id="invHistRefresh">Refresh</button>
    </div>
    <div class="table-scroll">
        <table><thead><tr><th>Date</th><th>Source</th><th>Asset</th><th>Event</th><th>Amount</th><th>Reference</th></tr></thead>
        <tbody id="invHistBody"><tr><td colspan="6">Loading…</td></tr></tbody></table>
    </div>
</main>
<script src="js/app-paths.js"></script>
<script src="js/storage.js?v=inv1"></script>
<script src="js/common.js"></script>
<script src="js/globalvest-bottom-nav.js?v=2"></script>
<script src="js/investment-history.js?v=1"></script>
</body>
</html>
