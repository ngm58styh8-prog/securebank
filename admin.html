<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="robots" content="noindex, nofollow">
<title>SecureBank — Admin Login</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<div class="container admin-login-box">
    <div class="login-box">
        <h1 class="logo admin-logo">🛡️ Admin Portal</h1>
        <p class="subtitle">SecureBank payment management</p>

        <form id="adminLoginForm">
            <input id="adminEmail" type="email" placeholder="Admin email" required autocomplete="email">
            <input id="adminPassword" type="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Sign In to Admin</button>
        </form>

        <p class="hint">Authorized personnel only.</p>
        <p class="hint admin-only-hint">Demo: admin@securebank.com / admin123</p>
        <p class="admin-back"><a href="index.html">← Back to user login</a></p>
    </div>
</div>

<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/admin-app.js"></script>
</body>
</html>
