<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#081B45">
<meta name="robots" content="noindex, nofollow">
<title>GlobalVest — Admin Login</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<div class="container admin-login-box">
    <div class="login-box">
        <h1 class="logo admin-logo brand-logo-header">
            <img src="assets/globalvest-logo-light.svg" alt="GlobalVest" class="brand-logo-img">
        </h1>
        <p class="subtitle">Admin Portal</p>
        <p class="subtitle">GlobalVest payment management</p>

        <form id="adminLoginForm">
            <input id="adminEmail" type="email" placeholder="Admin email" value="admin@globalvest.com" required autocomplete="email">
            <input id="adminPassword" type="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Sign In to Admin</button>
            <p class="admin-auth-message" id="adminAuthMessage" role="alert"></p>
        </form>

        <p class="hint">Authorized personnel only. Run <code>./start.sh</code>, then sign in at <code>http://localhost:8765/admin.html</code>.</p>
        <p class="hint">Default credentials: admin@globalvest.com / admin123</p>
        <p class="admin-back"><a href="index.html">← Back to website</a></p>
    </div>
</div>

<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/admin-app.js"></script>
</body>
</html>
