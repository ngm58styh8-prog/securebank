<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070B18">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/brand.css">
<title>GlobalVest — Transfer History</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/dashboard-premium.css">
<link rel="stylesheet" href="css/luxury.css">
<link rel="stylesheet" href="css/send-money.css">
</head>
<body class="luxury-app dashboard-premium send-money-page-body" data-theme="dark">

<header>
    <div class="header-left">
        <h2>📋 Transfer History</h2>
        <p>Internal GlobalVest send money activity</p>
    </div>
    <div class="header-right">
        <nav class="main-nav" id="mainNav">
            <a href="dashboard.html" class="nav-link" data-page="dashboard">Dashboard</a>
            <a href="exchange.html" class="nav-link" data-page="exchange">Exchange</a>
            <a href="support.html" class="nav-link" data-page="support">Support</a>
            <a href="settings.html" class="nav-link" data-page="settings">Settings</a>
        </nav>
        <a href="send-money.html" class="nav-link mobile-back">← Send Money</a>
        <button id="themeToggle" class="icon-btn" type="button">🌙</button>
        <button id="logoutBtn" class="icon-btn" type="button" title="Log out">🚪</button>
    </div>
</header>

<div class="container th-page">

<div class="th-export-row">
    <a href="send-money.html" class="sm-send-btn sm-link-btn" style="flex:0 0 auto;padding:10px 18px;font-size:0.9rem;">+ New Transfer</a>
    <button type="button" class="deposit-btn" id="exportCsvBtn">Export CSV</button>
    <button type="button" class="withdraw-btn" id="printBtn">Print Receipt</button>
</div>

<div class="th-toolbar card">
    <select id="periodFilter">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
        <option value="year">This Year</option>
    </select>
    <select id="statusFilter">
        <option value="all">All Status</option>
        <option value="completed">Completed</option>
        <option value="reversed">Reversed</option>
        <option value="pending">Pending</option>
        <option value="failed">Failed</option>
    </select>
    <input type="search" id="searchFilter" placeholder="Search reference, email…" class="wallet-search" style="flex:1;min-width:180px;">
</div>

<div id="transferList" class="th-list">
    <div class="th-empty">Loading transfers…</div>
</div>

<div id="printArea" class="print-only"></div>

</div>

<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/nav.js"></script>
<script src="js/transfer-history.js"></script>
<script src="js/luxury-ui.js"></script>

</body>
</html>
