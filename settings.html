<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0059b3">
<title>SecureBank — Settings</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<header>
    <div class="header-left">
        <h2>⚙️ Settings</h2>
        <p>Customize your SecureBank experience</p>
    </div>
    <div class="header-right">
        <a href="dashboard.html" class="nav-link">← Back to Dashboard</a>
        <button id="themeToggle" class="icon-btn" type="button">🌙</button>
    </div>
</header>

<div class="container settings-page">

<div id="siteAnnouncement" class="site-announcement hidden"></div>

<div class="card settings-section">
    <h3>Appearance</h3>
    <div class="setting-row">
        <span>Theme</span>
        <select id="themeSelect">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </div>
    <div class="setting-row">
        <span>Currency</span>
        <select id="currencySelect">
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
        </select>
    </div>
    <div class="setting-row">
        <span>Language</span>
        <select id="languageSelect">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
        </select>
    </div>
</div>

<div class="card settings-section">
    <h3>Security</h3>
    <div class="setting-row">
        <span>Two-Factor Authentication</span>
        <label class="toggle-switch">
            <input type="checkbox" id="twoFactorToggle">
            <span class="toggle-slider"></span>
        </label>
    </div>
    <p class="setting-hint" id="twoFactorHint">Add an extra layer of security to your account.</p>
    <button class="edit-profile-btn" type="button" id="changePasswordBtn">Change Password</button>
</div>

<div class="card settings-section">
    <button class="edit-profile-btn" type="button" id="saveSettingsBtn">Save Settings</button>
</div>

</div>

<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/settings.js"></script>

</body>
</html>
