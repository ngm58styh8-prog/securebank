<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070B18">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/brand.css">
<title>GlobalVest — Wallet & Transactions</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/dashboard-premium.css">
<link rel="stylesheet" href="css/luxury.css">
</head>
<body class="luxury-app dashboard-premium" data-theme="dark">

<header>
    <div class="header-left">
        <h2>💼 Portfolio</h2>
        <p>Banking, transactions, and portfolio overview</p>
    </div>
    <div class="header-right">
        <nav class="main-nav" id="mainNav">
            <a href="dashboard.html" class="nav-link" data-page="dashboard">Dashboard</a>
            <a href="exchange.html" class="nav-link" data-page="exchange">Exchange</a>
            <a href="support.html" class="nav-link" data-page="support">Support</a>
            <a href="settings.html" class="nav-link" data-page="settings">Settings</a>
        </nav>
        <a href="dashboard.html" class="nav-link mobile-back">← Dashboard</a>
        <button id="themeToggle" class="icon-btn" type="button">🌙</button>
        <button id="logoutBtn" class="icon-btn" type="button" title="Log out">🚪</button>
    </div>
</header>

<div class="container wallet-page">

<div id="siteAnnouncement" class="site-announcement hidden"></div>

<div id="lvPortfolioHero" class="lv-portfolio-hero"></div>

<div class="lv-banking-grid lv-animate-in">
    <div class="lv-bank-card">
        <div class="lv-bank-card-label">Checking Account</div>
        <div class="lv-bank-card-value" id="lvCheckingBalance">—</div>
        <span class="lv-bank-card-chip">Active</span>
    </div>
    <div class="lv-bank-card">
        <div class="lv-bank-card-label">Savings Account</div>
        <div class="lv-bank-card-value">$0.00</div>
        <span class="lv-bank-card-chip">Premium</span>
    </div>
</div>

<div class="card wallet-toolbar">
    <div class="toolbar-row">
        <input id="searchInput" type="search" placeholder="Search transactions..." class="wallet-search">
        <select id="filterSelect" class="wallet-filter">
            <option value="all">All</option>
            <option value="deposit">Deposits</option>
            <option value="transfer">Send Money</option>
            <option value="withdraw">Withdrawals</option>
            <option value="buy">Buys</option>
            <option value="sell">Sells</option>
            <option value="gold">Gold</option>
            <option value="stock">Stocks</option>
            <option value="investment">Investments</option>
        </select>
    </div>
    <div class="toolbar-row">
        <button class="deposit-btn" type="button" id="exportCsvBtn">Export CSV</button>
        <button class="withdraw-btn" type="button" id="exportPdfBtn">Export PDF</button>
    </div>
</div>

<div class="table-scroll">
<table id="walletTable">
<thead>
<tr>
    <th>Date</th>
    <th>Description</th>
    <th>Amount</th>
</tr>
</thead>
<tbody id="walletBody"></tbody>
</table>
</div>

<div class="pagination">
    <button type="button" id="prevPageBtn" class="page-btn">← Prev</button>
    <span id="pageInfo">Page 1 of 1</span>
    <button type="button" id="nextPageBtn" class="page-btn">Next →</button>
</div>

</div>

<div id="printArea" class="print-only"></div>

<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/notifications.js"></script>
<script src="js/nav.js"></script>
<script src="js/wallet.js"></script>
<script src="js/luxury-ui.js"></script>

</body>
</html>
